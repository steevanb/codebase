# Serves docs/ like GitHub Pages does
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/html text/css application/javascript;

    # /releases → /releases/ without the internal port 80 in the Location header
    absolute_redirect off;

    # Always serve the latest version of the files while editing them
    add_header Cache-Control "no-store" always;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
